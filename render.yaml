services:
  - type: web
    name: english-study-centre-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: english_study_centre
      - key: DEFAULT_HEADLINE
        value: ENGLISH STUDY CENTRE
      - key: WATERMARK_TEXT
        value: ENGLISH STUDY CENTRE
